name: Diagnose local inference (temporary)
on:
  push:
    branches: [fix/v2.0.1-counting-reliability]
    paths: [".github/workflows/diagnose-file-inference.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45625397383
          name: standalone-html-31c5dd0ca7068c63628b016053b68fcadf67f5b0
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser
        shell: pwsh
        run: |
          python -m pip install playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          python -m playwright install chromium
      - name: Reproduce with original generated HTML and capture worker error
        shell: pwsh
        run: python scripts/test-browser-smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-inference-diagnostic
          path: browser-smoke-results/*.png
          if-no-files-found: ignore
          retention-days: 3
