name: Verify offline inference (temporary)
on:
  push:
    branches: [fix/v2.0.1-counting-reliability]
    paths: [".github/workflows/verify-offline-inference-once.yml"]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare the verified generated alias and its official self-extract variant
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item image-counter.html dist/index.html
          $c = Get-Content app.config.json -Raw | ConvertFrom-Json
          ./scripts/build-self-extract.ps1 -InputPath dist/index.html -OutputPath dist/index.self-extract.html -AppName $c.name -AppNameJa $c.nameJa
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser
        shell: pwsh
        run: |
          python -m pip install playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          python -m playwright install chromium
      - name: Exercise actual offline detection and browser workflows
        shell: pwsh
        run: python scripts/test-browser-smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-counter-ex-offline-verification
          path: browser-smoke-results/*.png
          if-no-files-found: ignore
          retention-days: 3
